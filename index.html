<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujian Informatika Kelas VIII</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f1f5f9;
    }

    /* Bilah Peringatan Singkat di Atas */
    .top-notice {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 36px;
      background: #0f766e;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 600;
      z-index: 1000;
      padding: 0 10px;
      text-align: center;
    }

    /* Area Ujian */
    iframe {
      position: absolute;
      top: 36px;
      left: 0;
      width: 100%;
      height: calc(100% - 36px);
      border: none;
    }
  </style>
</head>
<body>

  <div class="top-notice">
    ⚠️ Mode Pengawas Aktif: Jangan pindah tab atau membuka aplikasi lain selama ujian.
  </div>

  <!-- Disarankan mengganti src di bawah dengan link panjang Google Form (akhiran /viewform?embedded=true) -->
  <iframe 
    id="examFrame" 
    src="https://docs.google.com/forms/d/e/1FAIpQLSflbkEEvGzUeJoCOqtIWV3t6vGLAHuq18Jxeb0ceahY34r0tg/viewform?usp=dialog" 
    allow="camera; microphone; fullscreen">
    Memuat Halaman Ujian...
  </iframe>

  <script>
    const frame = document.getElementById('examFrame');
    const urlAsli = frame.src;
    let sedangReset = false;
    let timerKeluar = null;

    function refreshDanHapusJawaban() {
      if (sedangReset) return;
      sedangReset = true;

      alert("PERINGATAN!\nAnda terdeteksi meninggalkan halaman ujian atau membuka aplikasi lain.\nHalaman akan dimuat ulang dan jawaban yang belum dikirim akan terhapus.");
      
      // Memuat ulang iframe untuk mereset isian
      frame.src = "";
      setTimeout(() => {
        frame.src = urlAsli;
        sedangReset = false;
      }, 300);
    }

    // Hanya mendeteksi jika tab/aplikasi benar-benar ditinggalkan (hidden)
    document.addEventListener("visibilitychange", function() {
      if (document.hidden) {
        // Beri toleransi 1.5 detik untuk menghindari salah deteksi akibat pop-up sistem HP
        timerKeluar = setTimeout(() => {
          refreshDanHapusJawaban();
        }, 1500);
      } else {
        // Batalkan reset jika siswa kembali sebelum 1.5 detik
        clearTimeout(timerKeluar);
      }
    });
  </script>
</body>
</html>
